@if (isLoading) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/20 backdrop-blur-[2px] transition-all">
    <div class="bg-surface-container-lowest p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3 border border-surface-container">
      <div class="w-10 h-10 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
      <p class="text-sm font-medium text-on-surface">{{ message || 'Chargement en cours...' }}</p>
    </div>
  </div>
}
