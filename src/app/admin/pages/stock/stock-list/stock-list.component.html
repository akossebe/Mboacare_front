<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">Liste des stocks</h4>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Accueil</a></li>
          <li class="breadcrumb-item active">Stocks</li>
        </ol>
      </nav>
    </div>
    <a routerLink="/admin/stocks/ajouter" class="btn btn-primary">
      <i class="bi bi-plus-lg me-2"></i>Ajouter un stock
    </a>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="isLoading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

  <div *ngIf="!isLoading" class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="d-flex align-items-center gap-2 px-3 py-2 rounded-3 mb-3" style="background:#f7f8fc; border:1px solid #ececec; width:280px;">
        <i class="bi bi-search text-secondary"></i>
        <input type="text" class="border-0 bg-transparent" placeholder="Rechercher..." style="outline:none; width:100%; font-size:13px;" [(ngModel)]="searchTerm">
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr><th>#</th><th>Nom</th><th>Quantité</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let s of filteredStocks(); let i = index">
              <td>{{ i + 1 }}</td>
              <td class="fw-semibold">{{ s.nom }}</td>
              <td>{{ s.quantite }}</td>
              <td>
                <div class="d-flex gap-2">
                  <a [routerLink]="['/admin/stocks/detail', s.idStock]" class="btn btn-sm btn-primary"><i class="bi bi-eye"></i></a>
                  <a [routerLink]="['/admin/stocks/modifier', s.idStock]" class="btn btn-sm btn-success"><i class="bi bi-pencil"></i></a>
                  <button class="btn btn-sm btn-danger" (click)="delete(s.idStock)"><i class="bi bi-trash"></i></button>
                </div>
              </td>
            </tr>
            <tr *ngIf="filteredStocks().length === 0">
              <td colspan="4" class="text-center text-muted py-4">Aucun stock trouvé</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
