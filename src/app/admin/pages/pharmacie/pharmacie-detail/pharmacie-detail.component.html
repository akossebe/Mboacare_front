<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">Détails de la pharmacie</h4>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Accueil</a></li>
          <li class="breadcrumb-item"><a routerLink="/admin/pharmacies">Pharmacies</a></li>
          <li class="breadcrumb-item active">Détails</li>
        </ol>
      </nav>
    </div>
    <a routerLink="/admin/pharmacies" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Retour</a>
  </div>

  <div *ngIf="isLoading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && pharmacie" class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="text-muted" style="font-size:13px;">Nom</label>
          <p class="fw-bold fs-5">{{ pharmacie.nom }}</p>
        </div>
        <div class="col-md-6">
          <label class="text-muted" style="font-size:13px;">Email</label>
          <p class="fw-bold fs-5">{{ pharmacie.email }}</p>
        </div>
        <div class="col-md-6">
          <label class="text-muted" style="font-size:13px;">Ville</label>
          <p class="fw-bold fs-5">{{ pharmacie.ville }}</p>
        </div>
        <div class="col-md-6">
          <label class="text-muted" style="font-size:13px;">Quartier</label>
          <p class="fw-bold fs-5">{{ pharmacie.quartier }}</p>
        </div>
      </div>
      <div class="mt-4">
        <a [routerLink]="['/admin/pharmacies/modifier', pharmacie.idPharmaci]" class="btn btn-success">
          <i class="bi bi-pencil me-2"></i>Modifier
        </a>
      </div>
    </div>
  </div>
</div>
