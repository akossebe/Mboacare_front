<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">{{ isEditMode ? 'Modifier une pharmacie' : 'Ajouter une pharmacie' }}</h4>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Accueil</a></li>
          <li class="breadcrumb-item"><a routerLink="/admin/pharmacies">Pharmacies</a></li>
          <li class="breadcrumb-item active">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</li>
        </ol>
      </nav>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success d-flex justify-content-between align-items-center">
    <span>{{ successMessage }}</span>
    <a routerLink="/admin/pharmacies" class="btn btn-success btn-sm"><i class="bi bi-list me-2"></i>Voir la liste</a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row">
        <div class="col-md-7">
          <form #pharmacieForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="nom" [(ngModel)]="pharmacie.nom" required minlength="3" #nom="ngModel">
              <div *ngIf="nom.invalid && nom.touched" class="text-danger mt-1" style="font-size:12px;">Minimum 3 caractères</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" name="email" [(ngModel)]="pharmacie.email" required email #email="ngModel">
              <div *ngIf="email.invalid && email.touched" class="text-danger mt-1" style="font-size:12px;">Email valide requis</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Ville <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="ville" [(ngModel)]="pharmacie.ville" required #ville="ngModel">
              <div *ngIf="ville.invalid && ville.touched" class="text-danger mt-1" style="font-size:12px;">Champ obligatoire</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Quartier <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="quartier" [(ngModel)]="pharmacie.quartier" required #quartier="ngModel">
              <div *ngIf="quartier.invalid && quartier.touched" class="text-danger mt-1" style="font-size:12px;">Champ obligatoire</div>
            </div>
            <div class="d-flex gap-3 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="pharmacieForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
              </button>
              <a routerLink="/admin/pharmacies" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
        <div class="col-md-5 d-flex align-items-center justify-content-center">
          <img src="pharmacie.jpeg" alt="pharmacie" class="img-fluid rounded-3" style="max-height:300px; object-fit:cover;">
        </div>
      </div>
    </div>
  </div>
</div>
