<div class="container-fluid p-4">
  <div class="mb-4">
    <h4 class="fw-bold mb-0">{{ isEditMode ? 'Modifier un médicament' : 'Ajouter un médicament' }}</h4>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Accueil</a></li>
        <li class="breadcrumb-item"><a routerLink="/admin/medicaments">Médicaments</a></li>
        <li class="breadcrumb-item active">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</li>
      </ol>
    </nav>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success d-flex justify-content-between align-items-center">
    <span>{{ successMessage }}</span>
    <a routerLink="/admin/medicaments" class="btn btn-success btn-sm"><i class="bi bi-list me-2"></i>Voir la liste</a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row">
        <div class="col-md-7">
          <form [formGroup]="medicamentForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="nom">
              <div *ngIf="medicamentForm.get('nom')?.invalid && medicamentForm.get('nom')?.touched" class="text-danger mt-1" style="font-size:12px;">Minimum 3 caractères</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Forme <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="forme">
              <div *ngIf="medicamentForm.get('forme')?.invalid && medicamentForm.get('forme')?.touched" class="text-danger mt-1" style="font-size:12px;">Champ obligatoire</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Prix (FCFA) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" formControlName="prix">
              <div *ngIf="medicamentForm.get('prix')?.invalid && medicamentForm.get('prix')?.touched" class="text-danger mt-1" style="font-size:12px;">Prix positif requis</div>
            </div>
            <div class="d-flex gap-3 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="medicamentForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
              </button>
              <a routerLink="/admin/medicaments" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
        <div class="col-md-5 d-flex align-items-center justify-content-center">
          <img src="medicament.jpeg" alt="medicament" class="img-fluid rounded-3" style="max-height:300px; object-fit:cover;">
        </div>
      </div>
    </div>
  </div>
</div>
