<main class="w-full min-h-screen bg-background flex items-center justify-center pt-20 pb-10">
  <div class="w-full max-w-lg bg-surface-container-lowest shadow-lg rounded-2xl p-8 transition-all">
    <div class="text-center mb-6 flex flex-col items-center">
      <img src="logo.jpg" alt="MboaCare" class="w-24 h-24 rounded-3xl object-cover shadow-lg border-2 border-surface-container bg-white mb-5 hover:scale-105 transition-transform" *ngIf="step === 1">
      <span class="material-symbols-outlined text-primary text-5xl mb-2" *ngIf="step === 2">
        medical_information
      </span>
      <h2 class="text-2xl font-bold text-on-surface">
        {{ step === 1 ? 'Créer un compte MboaCare' : 'Initialisation du carnet médical' }}
      </h2>
      <p class="text-sm text-on-surface-variant">
        {{ step === 1 ? 'Rejoignez-nous en tant que patient ou médecin.' : 'Ces données assureront un suivi médical complet et sécurisé.' }}
      </p>
    </div>
    
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-error/10 border border-error text-error rounded-lg text-sm text-center">
      {{ errorMessage }}
    </div>
    
    <!-- ÉTAPE 1 : IDENTITÉ ADMINISTRATIVES -->
    <form *ngIf="step === 1" (ngSubmit)="passerEtape2()" #step1Form="ngForm" class="flex flex-col gap-4 animate-in fade-in slide-in-from-left-4 duration-300">
      
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="nom" class="text-sm font-semibold text-on-surface">Nom</label>
          <input type="text" id="nom" name="nom" [(ngModel)]="user.nom" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Votre nom" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="prenom" class="text-sm font-semibold text-on-surface">Prénom</label>
          <input type="text" id="prenom" name="prenom" [(ngModel)]="user.prenom" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Votre prénom" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-semibold text-on-surface">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="user.email" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="email@exemple.com" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="telephone" class="text-sm font-semibold text-on-surface">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" [(ngModel)]="user.telephone" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Numéro" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="ville" class="text-sm font-semibold text-on-surface">Ville</label>
          <input type="text" id="ville" name="ville" [(ngModel)]="user.ville" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: Douala" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="quartier" class="text-sm font-semibold text-on-surface">Quartier</label>
          <input type="text" id="quartier" name="quartier" [(ngModel)]="user.quartier" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: Akwa" />
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="motDePasse" class="text-sm font-semibold text-on-surface">Mot de passe</label>
          <input type="password" id="motDePasse" name="motDePasse" [(ngModel)]="user.motDePasse" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="********" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="confirmerMotDePasse" class="text-sm font-semibold text-on-surface">Confirmer</label>
          <input type="password" id="confirmerMotDePasse" name="confirmerMotDePasse" [(ngModel)]="user.confirmerMotDePasse" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="********" />
        </div>
      </div>
      
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-on-surface">Type de profil</label>
        <select name="role" [(ngModel)]="user.role" required
                class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40">
          <option value="patient">Patient (Mon carnet médical)</option>
          <option value="medecin">Médecin / Professionnel</option>
        </select>
      </div>
      
      <button type="submit" [disabled]="!step1Form.form.valid"
              class="w-full mt-4 py-3 flex items-center justify-center gap-2 bg-primary text-on-primary rounded-xl font-bold hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <span>Continuer</span>
        <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </form>
    
    <!-- ÉTAPE 2 : INFORMATIONS COMPLÉMENTAIRES -->
    <form *ngIf="step === 2" (ngSubmit)="onSubmitFinal()" #step2Form="ngForm" class="flex flex-col gap-4 animate-in fade-in slide-in-from-right-4 duration-300">
      
      <!-- VARIQUEMENT POUR PATIENT -->
      <ng-container *ngIf="user.role === 'patient'">
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label for="dateNaissance" class="text-sm font-semibold text-on-surface">Date de naissance</label>
            <input type="date" id="dateNaissance" name="dateNaissance" [(ngModel)]="user.dateNaissance" required
                   class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" />
          </div>
          
          <div class="flex flex-col gap-2">
            <label for="genre" class="text-sm font-semibold text-on-surface">Genre</label>
            <select id="genre" name="genre" [(ngModel)]="user.genre" required
                    class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40">
              <option value="" disabled selected>Sélectionnez</option>
              <option value="Homme">Homme</option>
              <option value="Femme">Femme</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="groupeSanguin" class="text-sm font-semibold text-on-surface">Groupe sanguin et Rhésus</label>
          <select id="groupeSanguin" name="groupeSanguin" [(ngModel)]="user.groupeSanguin" required
                  class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40">
            <option value="" disabled selected>Sélectionnez votre groupe sanguin</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="Inconnu">Je ne sais pas</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label for="poids" class="text-sm font-semibold text-on-surface">Poids (kg)</label>
            <input type="number" id="poids" name="poids" [(ngModel)]="user.poids" required step="0.1" min="1"
                   class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: 70" />
          </div>
          
          <div class="flex flex-col gap-2">
            <label for="taille" class="text-sm font-semibold text-on-surface">Taille (cm)</label>
            <input type="number" id="taille" name="taille" [(ngModel)]="user.taille" required min="30"
                   class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: 175" />
          </div>
        </div>
      </ng-container>

      <!-- UNIQUEMENT POUR MEDECIN -->
      <ng-container *ngIf="user.role === 'medecin'">
        <div class="flex flex-col gap-2">
          <label for="numeroOrdre" class="text-sm font-semibold text-on-surface">Numéro d'Ordre National (ONMC)</label>
          <input type="text" id="numeroOrdre" name="numeroOrdre" [(ngModel)]="user.numeroOrdre" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: ONMC-12345" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="specialite" class="text-sm font-semibold text-on-surface">Spécialité</label>
          <select id="specialite" name="specialite" [(ngModel)]="user.specialite" required
                  class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40">
            <option value="" disabled selected>Sélectionnez votre spécialité</option>
            <option value="Généraliste">Généraliste</option>
            <option value="Pédiatre">Pédiatre</option>
            <option value="Cardiologue">Cardiologue</option>
            <option value="Gynécologue">Gynécologue</option>
            <option value="Ophtalmologue">Ophtalmologue</option>
            <option value="Dentiste">Dentiste</option>
            <option value="Autre">Autre spécialité</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label for="lieuExercice" class="text-sm font-semibold text-on-surface">Lieu d'exercice actuel</label>
          <input type="text" id="lieuExercice" name="lieuExercice" [(ngModel)]="user.lieuExercice" required
                 class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="Ex: Hôpital Général de Yaoundé" />
        </div>
      </ng-container>

      <div class="flex items-center gap-3 mt-4">
        <button type="button" (click)="retourEtape1()" [disabled]="isLoading"
                class="w-1/3 py-3 bg-surface-container text-on-surface rounded-xl font-bold hover:bg-surface-container-high transition-colors disabled:opacity-50">
          Retour
        </button>
        <button type="submit" [disabled]="!step2Form.form.valid || isLoading"
                class="w-2/3 py-3 flex items-center justify-center gap-2 bg-primary text-on-primary rounded-xl font-bold hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">Terminer l'inscription</span>
          <span *ngIf="isLoading" class="material-symbols-outlined animate-spin">autorenew</span>
        </button>
      </div>
    </form>
    
    <div *ngIf="step === 1" class="mt-6 text-center text-sm text-on-surface-variant">
      <a routerLink="/connexion" class="text-primary hover:underline font-semibold">Déjà un compte ? Connectez-vous</a>
    </div>
  </div>
</main>
