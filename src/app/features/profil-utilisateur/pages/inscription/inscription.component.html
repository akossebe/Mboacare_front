<main class="w-full h-screen bg-background flex items-center justify-center pt-20">
  <div class="w-full max-w-md bg-surface-container-lowest shadow-lg rounded-2xl p-8">
    <div class="text-center mb-8">
      <span class="material-symbols-outlined text-primary text-5xl mb-2">person_add</span>
      <h2 class="text-2xl font-bold text-on-surface">Créer un compte MboaCare</h2>
      <p class="text-sm text-on-surface-variant">Rejoignez-nous en tant que patient, médecin ou pharmacie.</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #inscriptionForm="ngForm" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="nom" class="text-sm font-semibold text-on-surface">Nom complet</label>
        <input type="text" id="nom" name="nom" [(ngModel)]="user.nom" required
               class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-on-surface">Adresse Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="user.email" required
               class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      
      <div class="flex flex-col gap-2">
        <label for="motDePasse" class="text-sm font-semibold text-on-surface">Mot de passe</label>
        <input type="password" id="motDePasse" name="motDePasse" [(ngModel)]="user.motDePasse" required
               class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-on-surface">Type de compte</label>
        <select name="role" [(ngModel)]="user.role" required
                class="w-full p-3 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40">
          <option value="patient">Patient</option>
          <option value="medecin">Médecin</option>
        </select>
      </div>
      
      <button type="submit" [disabled]="!inscriptionForm.form.valid"
              class="w-full mt-4 py-3 bg-primary text-on-primary rounded-xl font-bold hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        S'inscrire
      </button>
    </form>
    
    <div class="mt-6 text-center text-sm text-on-surface-variant">
      <a routerLink="/connexion" class="text-primary hover:underline font-semibold">Déjà un compte ? Connectez-vous</a>
    </div>
  </div>
</main>
